services:
  mysql:
    image: mysql:8.4
    container_name: contacerta-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root      # mesma senha do DAO.java
      MYSQL_DATABASE: contacerta     # mesmo nome de banco do DAO.java
      TZ: America/Sao_Paulo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"                  # porta_do_seu_pc:porta_do_container
    volumes:
      # Todo arquivo .sql da pasta sql/ roda sozinho na PRIMEIRA vez que o banco sobe
      - ./sql:/docker-entrypoint-initdb.d:ro
      # Guarda os dados do banco mesmo se o container for desligado
      - contacerta-dados:/var/lib/mysql

volumes:
  contacerta-dados:
