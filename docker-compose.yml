services:
  mysql:
    image: mysql:8.4 # imagem q eu usei no container
    container_name: contacerta-mysql # nome do container
    environment:
      MYSQL_ROOT_PASSWORD: root      # mesma senha do DAO.java
      MYSQL_DATABASE: contacerta     # mesmo nome de banco do DAO.java
      TZ: America/Sao_Paulo          # fuso horario
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"                  # porta_do_pc:porta_container
    volumes:
      # todos os arquivos q sao .sql na pasta sql vai rodar sozinho apenas na >PRIMEIRA< vez que o banco sobe
      - ./sql:/docker-entrypoint-initdb.d:ro
      # vai guardar os dados do banco de dados mesmo se o container do docker for desligado
      - contacerta-dados:/var/lib/mysql

volumes:
  contacerta-dados:
